name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unittest:
    # D2ScriptViewer es una herramienta de Windows: el guardado atómico, los
    # atributos de solo lectura y los bloqueos de archivo solo se prueban de
    # verdad sobre NTFS. Los tests con el archivo real se omiten aquí.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Comprobar que no hacen falta dependencias externas
        run: python -c "import d2scriptviewer, d2scriptviewer.cli, d2scriptviewer.document, d2scriptviewer.verification, d2scriptviewer.search, d2scriptviewer.edits, d2scriptviewer.gui.app"

      - name: Versión
        run: python -m d2scriptviewer --version

      - name: Tests
        run: python -m unittest discover -s tests -v
